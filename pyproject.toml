[project]
name = "riverbend-workorders"
version = "0.1.0"
description = "Turns messy inbound customer messages into structured, priced work orders for a multi-tenant bike repair chain."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "openai>=1.54",
  "google-cloud-pubsub>=2.23",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: needs a Postgres at TEST_DATABASE_URL", "emulator: needs the Pub/Sub emulator"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D100", "D101", "D103"]
ignore = ["B008"]  # FastAPI Depends()/Header() in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"app/extraction/prompt.py" = ["E501"]
"tests/*" = ["E501", "D"]
"scripts/*" = ["D103"]
